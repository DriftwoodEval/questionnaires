name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: questionnaires-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run tests
        run: docker run --rm -e HEADLESS=true questionnaires-test:ci

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for qreceive image
        id: meta-qreceive
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-qreceive

      - name: Build and push qreceive image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: qreceive
          push: true
          tags: ${{ steps.meta-qreceive.outputs.tags }}
          labels: ${{ steps.meta-qreceive.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - uses: actions/delete-package-versions@v5
        with:
          package-name: "questionnaires-qreceive"
          package-type: "container"
          min-versions-to-keep: 5

      - name: Extract metadata for log-server image
        id: meta-log-server
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-log-server

      - name: Build and push log-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: log-server
          push: true
          tags: ${{ steps.meta-log-server.outputs.tags }}
          labels: ${{ steps.meta-log-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - uses: actions/delete-package-versions@v5
        with:
          package-name: "questionnaires-log-server"
          package-type: "container"
          min-versions-to-keep: 5

  deploy:
    runs-on: ubuntu-latest
    needs: test-build-push
    steps:
      # Requires a Tailscale OAuth client with access to the primary host's
      # tailnet (secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET) - the
      # same host and Watchtower instance winnonah's own deploy job uses.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # Watchtower monitors every container on the host, qreceive and
      # log-server included, so this triggers the same instance winnonah
      # deploys through rather than running a second one. qreceive's
      # lifecycle hook labels (docker-compose.yaml) make Watchtower wait out
      # an in-progress run before restarting that container.
      - name: Trigger watchtower update
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
            "http://${{ secrets.WATCHTOWER_HOST }}:8080/v1/update"
